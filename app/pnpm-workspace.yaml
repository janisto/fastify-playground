autoInstallPeers: false
strictPeerDependencies: true
nodeVersion: 24.18.0
engineStrict: true
strictDepBuilds: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # First-party release adopted intentionally before the one-day quarantine elapsed.
  - fastify-observability@2.0.0
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
trustPolicy: no-downgrade
blockExoticSubdeps: true

# @fastify/swagger-ui 6.1.0 still declares @fastify/static 9, whose entire
# release line is affected by GHSA-83w8-p2f5-377r and GHSA-8pvw-jcv7-9cmj.
# Static 10 remains compatible with Fastify 5; keep this override only until
# swagger-ui widens its range.
overrides:
  '@fastify/static': 10.1.2

auditConfig:
  ignoreGhsas:
    # Reached through rimraf/glob packages that the Firebase Admin Firestore
    # runtime chain does not import. Minimatch 9 cannot accept the patched major.
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: false
