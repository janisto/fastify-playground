# Auto-label PRs based on changed file paths
# Docs: https://github.com/actions/labeler

# Application code
app:
  - changed-files:
      - any-glob-to-any-file: 'app/src/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'app/tests/**'

functions:
  - changed-files:
      - any-glob-to-any-file: 'functions/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'AGENTS.md'
          - '.agents/**/*.md'
          - '.github/**/*.md'

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - '.node-version'
          - 'Justfile'
          - 'biome.json'
          - 'app/biome.json'
          - 'app/Dockerfile'
          - 'app/.dockerignore'
          - 'app/package.json'
          - 'app/pnpm-lock.yaml'
          - 'app/pnpm-workspace.yaml'
          - 'app/tsconfig*.json'
          - 'app/vitest.config.*'

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/dependabot.yml'

feature:
  - head-branch: ['^feature', 'feature']

bug:
  - head-branch: ['^bug', 'bug']

improvement:
  - head-branch: ['^improve', 'improve', 'improvement']
