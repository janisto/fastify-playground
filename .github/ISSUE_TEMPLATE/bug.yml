name: Bug report
description: Report reproducible incorrect behavior in fastify-playground
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and review the relevant README section before filing. Reduce the problem to the smallest reproduction you can share, preferably a `fastify.inject()` test or copied text rather than screenshots.

        Remove credentials, tokens, authorization headers, cookies, Firebase data, GitHub tokens, personal data, and other sensitive production information.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched the existing issues and did not find a matching report.
          required: true
        - label: I reviewed the README section relevant to this behavior.
          required: true
        - label: I removed secrets, credentials, tokens, authorization headers, cookies, Firebase data, GitHub tokens, and PII from everything I am submitting.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected route or area
      options:
        - Application startup or shutdown
        - Health or readiness probes
        - Authentication or Firebase
        - CORS, headers, or security
        - Content negotiation or CBOR
        - Validation, Problem Details, or schemas
        - Pagination
        - GitHub proxy
        - Observability or logging
        - Build, container, CI, or dependencies
        - Documentation
        - Other or uncertain
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Include the exact status, response, error, or incorrect structured output when available.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction or strongest evidence
      description: Provide exact steps and the smallest runnable test or request. If it is intermittent, describe the original conditions and strongest concrete evidence.
      placeholder: |
        1. Configure the application with ...
        2. Run this test or send this request ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Application revision
      description: Provide the exact commit ID or branch and commit ID.
      placeholder: "Example: abc1234"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Paste the output of `node --version`.
      placeholder: "Example: v24.18.0"
    validations:
      required: true

  - type: input
    id: pnpm-version
    attributes:
      label: pnpm version
      description: Paste the output of `corepack pnpm --version`.
      placeholder: "Example: 11.13.0"
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: Deployment and runtime context
      description: Include OS and architecture, container or cloud runtime, Firebase emulator or provider, proxy topology, and other relevant context. Do not include credentials.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Intermittently
        - Happened once
        - Unable to reproduce independently
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
      description: Describe affected users or operations, severity, and any current workaround.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste relevant logs, stack traces, request IDs, or response bodies after removing all sensitive data.
      render: shell

  - type: textarea
    id: ai-assistance
    attributes:
      label: Agent or AI assistance
      description: Optional. Include tool/model, contribution, verification performed, and human-review status. Do not include private prompts or transcripts.
      placeholder: |
        Tool and model:
        Contribution:
        Verification:
        Human review:

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
