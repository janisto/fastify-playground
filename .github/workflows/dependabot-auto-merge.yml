# Automatically approve and merge Dependabot PRs for minor and patch updates
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, auto_merge_enabled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Dependabot approval and auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write # Enable squash auto-merge for eligible dependency updates.
      pull-requests: write # Label and approve eligible Dependabot pull requests.

    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'janisto/fastify-playground'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Disable auto-merge for separately maintained tools
        if: contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, '@biomejs/biome')
        run: |
          auto_merge_enabled="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$auto_merge_enabled" == true ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and auto-merge minor and patch updates
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, '@biomejs/biome')
        run: |
          gh pr edit "$PR_URL" --add-label "automerge"
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
