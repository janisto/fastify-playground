name: Manually Label PRs

on:
  workflow_dispatch:
    inputs:
      maxCount:
        description: "Max number of PRs to process"
        required: true
        default: 200
        type: number
      scope:
        description: "Which PRs to consider: 'closed' or 'all'"
        required: true
        default: "closed"
        type: choice
        options:
          - closed
          - all

concurrency:
  group: label-prs
  cancel-in-progress: false

permissions: {}

jobs:
  collect-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    outputs:
      pr_numbers: ${{ steps.get_prs.outputs.pr_numbers }}
      pr_count: ${{ steps.get_prs.outputs.pr_count }}

    steps:
      - name: Collect PR numbers
        id: get_prs
        uses: actions/github-script@v9.0.0
        with:
          retries: 3
          script: |
            const maxCount = Number(process.env.INPUT_MAX_COUNT);
            if (!Number.isSafeInteger(maxCount) || maxCount < 1 || maxCount > 256) {
              throw new Error("maxCount must be an integer between 1 and 256");
            }

            const scope = process.env.INPUT_SCOPE;
            if (scope !== "closed" && scope !== "all") {
              throw new Error("scope must be either 'closed' or 'all'");
            }

            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: scope,
              per_page: 100
            });

            const prNumbersAll = allPRs.map(pr => pr.number).sort((a, b) => a - b);
            const prNumbers = prNumbersAll.slice(0, maxCount);

            core.info(`Collected ${prNumbers.length} ${scope} PRs (max ${maxCount}): ${prNumbers.slice(0,20).join(", ")}...`);

            core.setOutput("pr_numbers", JSON.stringify(prNumbers));
            core.setOutput("pr_count", String(prNumbers.length));
        env:
          INPUT_MAX_COUNT: ${{ inputs.maxCount }}
          INPUT_SCOPE: ${{ inputs.scope }}

  label-prs-matrix:
    if: needs.collect-prs.outputs.pr_count != '0'
    needs: collect-prs

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    strategy:
      max-parallel: 10
      matrix:
        pr: ${{ fromJson(needs.collect-prs.outputs.pr_numbers) }}

    steps:
      - uses: actions/labeler@v6.2.0
        with:
          pr-number: ${{ matrix.pr }}
          configuration-path: .github/labeler.yml
          sync-labels: true
