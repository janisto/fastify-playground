name: App code quality (linting and formatting)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Biome
        uses: biomejs/setup-biome@v2.7.1
        with:
          version: "2.5.3"

      - name: Run Biome
        run: biome ci .
