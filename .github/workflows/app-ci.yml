name: App linting, typing, tests and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.13.0

      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          cache-dependency-path: "app/pnpm-lock.yaml"
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck source and tests
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Run test coverage
        id: test-coverage
        run: pnpm test:coverage

      - name: Report coverage summary
        if: ${{ !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: davelosert/vitest-coverage-report-action@v2.12.2
        with:
          working-directory: app
          name: app

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-coverage
          path: app/coverage
