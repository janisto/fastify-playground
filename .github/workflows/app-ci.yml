name: App typing, tests, coverage and container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.13.0

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache-dependency-path: "app/pnpm-lock.yaml"
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck source and tests
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Run test coverage
        id: test-coverage
        run: pnpm test:coverage

      - name: Report coverage summary
        if: ${{ !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: davelosert/vitest-coverage-report-action@v2.12.2
        with:
          working-directory: app
          name: app

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-coverage
          path: app/coverage

  container:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build production image
        run: docker build --tag fastify-playground:ci .

      - name: Smoke startup, probes, and graceful shutdown
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1::8080 fastify-playground:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          ready=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          curl --fail --silent "http://127.0.0.1:${port}/health" | jq --exit-status '.status == "healthy"'
          curl --fail --silent "http://127.0.0.1:${port}/status" | jq --exit-status '.status == "ready"'

          docker stop --time 10 "$container_id" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" -eq 0
          docker rm "$container_id" >/dev/null
          trap - EXIT
