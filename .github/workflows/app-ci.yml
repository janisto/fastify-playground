name: App validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache-dependency-path: app/pnpm-lock.yaml
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint rules
        run: pnpm check

      - name: Typecheck source and tests
        run: pnpm typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  tests:
    name: App build and tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache-dependency-path: app/pnpm-lock.yaml
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Run test coverage
        id: test-coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-coverage
          path: app/coverage
          if-no-files-found: error

  container:
    name: Container build and smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag fastify-playground:ci --file Dockerfile ..

      - name: Verify runtime version and user
        run: |
          test "$(docker run --rm fastify-playground:ci --version)" = "v24.22.1"
          test "$(docker image inspect --format '{{.Config.User}}' fastify-playground:ci)" = "65532:65532"

      - name: Smoke startup, probes, and graceful shutdown
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1::8080 fastify-playground:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          ready=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          curl --fail --silent "http://127.0.0.1:${port}/health" | jq --exit-status '.status == "healthy"'
          curl --fail --silent "http://127.0.0.1:${port}/status" | jq --exit-status '.status == "ready"'
          curl --fail --silent "http://127.0.0.1:${port}/.well-known/api-catalog" | jq --exit-status '.linkset[0]["service-desc"][0].href == "/openapi.json"'
          curl --fail --silent "http://127.0.0.1:${port}/llms.txt" | cmp ../llms.txt
          curl --fail --silent "http://127.0.0.1:${port}/llms-full.txt" | cmp ../llms-full.txt

          docker stop --time 10 "$container_id" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" -eq 0
          docker rm "$container_id" >/dev/null
          trap - EXIT

  actionlint:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.7.1
        env:
          ZIZMOR_OFFLINE: 'true'
        with:
          version: '1.31.1'
          persona: pedantic
          online-audits: false
          advanced-security: false

  ci:
    name: ci
    if: always()
    needs: [quality, tests, container, actionlint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require every validation job to succeed
        run: |
          if [[ "$QUALITY_RESULT" != success || "$TESTS_RESULT" != success ||
                "$CONTAINER_RESULT" != success || "$ACTIONLINT_RESULT" != success ||
                "$ZIZMOR_RESULT" != success ]]; then
            printf '%s\n' 'A required validation job failed, was cancelled, or was skipped.' >&2
            exit 1
          fi
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
